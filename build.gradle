plugins {
    id 'java'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

sourceSets.main.java.srcDirs = ['src']

repositories {
    mavenCentral()
}

dependencies {
    // Starsector core (obfuscated game classes + bundled libs: lwjgl, json, log4j, ...)
    compileOnly fileTree(dir: "${starsectorPath}/starsector-core", include: '*.jar')
    // LunaLib supplies the settings page. Found wherever the mod happens to be installed.
    compileOnly fileTree(dir: "${starsectorPath}/mods", include: '**/LunaLib.jar')
    // PatchLib is optional. Compile against its API jar only, as its wiki says. The same jar carries
    // PatchLib's annotation processor, which checks the patch method signatures at compile time.
    def patchLibApi = fileTree(dir: "${starsectorPath}/mods", include: '**/jars/PatchLibAPI.jar')
    compileOnly patchLibApi
    annotationProcessor patchLibApi
}

jar {
    destinationDirectory = file('jars')
    archiveFileName = 'SkipClicks.jar'
}

// Starsector's classloader refuses java.io, java.nio.file and java.lang.reflect to mod code, and the
// refusal happens at class-resolution time - so a stray import surfaces as a crash somewhere else
// entirely. Catch it at build time instead by scanning every compiled class's constant pool.
tasks.register('checkNoForbiddenApis') {
    dependsOn tasks.named('classes')
    outputs.upToDateWhen { false }
    doLast {
        def forbidden = ['java/io/', 'java/nio/file/', 'java/lang/reflect/']
        def offenders = []
        fileTree(dir: layout.buildDirectory.dir('classes/java/main').get().asFile, include: '**/*.class').each { f ->
            def text = new String(f.bytes, 'ISO-8859-1')
            forbidden.each { needle ->
                if (text.contains(needle)) offenders << "${f.name} references ${needle}"
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException("Forbidden API used (Starsector will refuse to load it):\n  " +
                    offenders.join('\n  '))
        }
    }
}

// PatchLib is optional: only the patch classes may name it, or the mod breaks without PatchLib.
tasks.register('checkPatchLibIsolated') {
    dependsOn tasks.named('classes')
    outputs.upToDateWhen { false }
    doLast {
        def offenders = []
        def root = layout.buildDirectory.dir('classes/java/main').get().asFile
        fileTree(dir: root, include: '**/*.class').each { f ->
            def path = root.toPath().relativize(f.toPath()).toString().replace('\\', '/')
            if (path.startsWith('skipclicks/patches/')) return
            def text = new String(f.bytes, 'ISO-8859-1')
            if (text.contains('patchlib/') || text.contains('skipclicks/patches/')) offenders << path
        }
        if (!offenders.isEmpty()) {
            throw new GradleException("Only skipclicks.patches may refer to PatchLib or the patches:\n  " +
                    offenders.join('\n  '))
        }
    }
}

tasks.named('jar') { dependsOn tasks.named('checkNoForbiddenApis'), tasks.named('checkPatchLibIsolated') }

/** mod_info.json, the .version file and the Version Checker registration must agree. */
tasks.register('checkVersionMetadata') {
    doLast {
        def infoFile = file('mod_info.json')
        def versionFile = file('skipclicks.version')
        def registrationFile = file('data/config/version/version_files.csv')
        [infoFile, versionFile, registrationFile].each { metadata ->
            if (!metadata.isFile()) throw new GradleException("Missing update metadata: ${metadata.name}")
        }
        def parser = new groovy.json.JsonSlurper()
        def info = parser.parse(infoFile, 'UTF-8')
        def remote = parser.parse(versionFile, 'UTF-8')
        def parts = ['major', 'minor', 'patch'].collect { remote.modVersion?.get(it)?.toString() }
        if (parts.any { it == null || !(it ==~ /\d+/) } || info.version != parts.join('.'))
            throw new GradleException('mod_info.json and skipclicks.version must have the same numeric version')
        def masterUrl = 'https://raw.githubusercontent.com/andrzejsokolowski/starsector-skipclicks/main/skipclicks.version'
        def downloadUrl = 'https://github.com/andrzejsokolowski/starsector-skipclicks/releases/latest/download/SkipClicks.zip'
        if (info.id != 'skipclicks' || info.name != remote.modName)
            throw new GradleException('Update metadata must identify SkipClicks')
        if (info.updateCheckURL != masterUrl || remote.masterVersionFile != masterUrl)
            throw new GradleException('Both update URLs must point to the published skipclicks.version file')
        if (remote.directDownloadURL != downloadUrl)
            throw new GradleException('The update download must point to the SkipClicks.zip release asset')
        if (info.modThreadId?.toString() != remote.modThreadId?.toString())
            throw new GradleException('mod_info.json and the .version file must name the same forum topic')
        if (info.gameVersion != remote.starsectorVersion)
            throw new GradleException('The supported Starsector versions do not match')
        if (registrationFile.readLines('UTF-8').findAll { !it.trim().isEmpty() } != ['version file', 'skipclicks.version'])
            throw new GradleException('Version Checker must register skipclicks.version')
        logger.lifecycle("Update metadata verified for SkipClicks ${info.version}")
    }
}

/**
 * Checks the files that ship: no UTF-8 BOM (it breaks every Starsector JSON and CSV), every art path
 * exists, LunaLib text has no %, and every rule command named in rules.csv is a class in the jar.
 */
tasks.register('checkReleaseFiles') {
    doLast {
        def problems = []
        fileTree(projectDir) {
            include 'mod_info.json', '*.version', 'data/**/*.json', 'data/**/*.csv'
        }.each { f ->
            def bytes = f.bytes
            if (bytes.length >= 3 && (bytes[0] & 0xFF) == 0xEF && (bytes[1] & 0xFF) == 0xBB && (bytes[2] & 0xFF) == 0xBF)
                problems << "UTF-8 BOM in ${projectDir.toPath().relativize(f.toPath())}"
        }

        def core = file("${starsectorPath}/starsector-core")
        def artRef = ~/graphics\/[A-Za-z0-9_\-\/. ]+?\.(png|jpg|webp)/
        fileTree(projectDir) { include 'data/**', 'src/**/*.java' }.each { f ->
            (f.getText('UTF-8') =~ artRef).each { match ->
                def path = match[0]
                if (!file(path).isFile() && !new File(core, path).isFile())
                    problems << "${projectDir.toPath().relativize(f.toPath())} names missing art ${path}"
            }
        }
        // LunaLib runs setting names and descriptions through String.format: a bare % crashes the
        // game the moment that settings tab opens. Write "percent" instead.
        file('data/config/LunaSettings.csv').readLines('UTF-8').eachWithIndex { line, i ->
            if (line.contains('%')) problems << "LunaSettings.csv line ${i + 1} contains % (crashes LunaLib): write \"percent\""
        }
        def luna = new groovy.json.JsonSlurper().parse(file('data/config/LunaSettingsConfig.json'))
        if (!luna.containsKey('skipclicks')) problems << 'LunaLib icon is not keyed by the mod id'
        luna.each { modId, config -> if (!file(config.iconPath).isFile()) problems << "LunaLib icon missing: ${config.iconPath}" }

        // A rules.csv command with no class behind it only fails when the rule fires in game.
        def rules = file('data/campaign/rules.csv').getText('UTF-8')
        (rules =~ /SKC_[A-Za-z]+/).collect { it }.unique().each { command ->
            if (!file("src/skipclicks/rulecmd/${command}.java").isFile())
                problems << "rules.csv names ${command}, but src/skipclicks/rulecmd/${command}.java does not exist"
        }
        // Misc.tokenize reads any of =<>+- as an operator, which turns an SKC_ command line into a comparison.
        rules.readLines().each { line ->
            def m = line =~ /(SKC_[A-Za-z]+[^",]*)/
            m.each { match ->
                def cmd = match[1]
                if (cmd =~ /[=<>+\-]/) problems << "rules.csv command line has an operator character: ${cmd}"
            }
        }

        if (problems) throw new GradleException("Release files are not ready:\n  " + problems.join('\n  '))
        logger.lifecycle('Release files verified')
    }
}

tasks.named('check') {
    dependsOn tasks.named('checkNoForbiddenApis'), tasks.named('checkPatchLibIsolated'),
            tasks.named('checkVersionMetadata'), tasks.named('checkReleaseFiles')
}

// Only what the game loads.
def releaseFiles = copySpec {
    from(projectDir) {
        include 'mod_info.json', 'skipclicks.version', 'LICENSE'
        include 'data/**', 'graphics/**', 'jars/SkipClicks.jar'
    }
}

// Sync, not Copy: files that no longer ship must not linger in the staging folder.
tasks.register('stageRelease', Sync) {
    dependsOn tasks.named('jar')
    with releaseFiles
    into layout.projectDirectory.dir('SkipClicks')
}

// Package directly from the source files so stale staging contents cannot enter a release.
tasks.register('releaseZip', Zip) {
    dependsOn tasks.named('stageRelease'), tasks.named('check')
    destinationDirectory = layout.projectDirectory
    archiveFileName = 'SkipClicks.zip'
    into('SkipClicks') { with releaseFiles }
}
